# Copy this service and volume into an existing Compose project.
services:
  clan-clog:
    image: ${IMAGE_NAME:-ghcr.io/kihiralove/clan-clog}:${IMAGE_TAG:?Set IMAGE_TAG to a published release}
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the website origin}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:8080'
    volumes:
      - clan-clog-data:/data
    security_opt: ['no-new-privileges:true']
volumes:
  clan-clog-data:
