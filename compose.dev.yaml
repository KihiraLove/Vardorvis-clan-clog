# Both runtime and bootstrap use the one application build.
services:
  init:
    image: clan-clog:dev
    build: { context: ., target: app }
  setup-admin:
    image: clan-clog:dev
    build: { context: ., target: app }
  migrate:
    image: clan-clog:dev
    build: { context: ., target: app }
  app:
    image: clan-clog:dev
    build: { context: ., target: app }
    environment:
      NODE_ENV: development
  db:
    ports: ['127.0.0.1:5432:5432']
