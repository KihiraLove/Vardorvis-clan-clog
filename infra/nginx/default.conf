# One origin for the SPA and API; TLS terminates outside this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Nginx liveness is distinct from the API image's database readiness probe.
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Direct /admin and /xp navigation needs the React entry document.
    location / { try_files $uri $uri/ /index.html; }
}
