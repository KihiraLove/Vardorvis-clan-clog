# One origin for the SPA and API; TLS terminates outside this container.
log_format safe_request '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout safe_request;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Send one canonical value when the API also supplies these protections.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    # React updates individual CSSOM properties; no inline scripts/styles are needed.
    # data:/blob: images are restricted to local screenshot/upload previews.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    # Nginx liveness is distinct from the API image's database readiness probe.
    location = /healthz { access_log off; return 200 'ok'; }
    location = /readyz { access_log off; proxy_pass http://127.0.0.1:3000; }
    # One 2 MiB image plus bounded multipart overhead.
    client_max_body_size 3m;
    # Screenshots and both exact clan logo routes allow 10 MiB files with
    # bounded multipart overhead; other API routes retain the 3 MiB default.
    location ~ ^/api/v1/(runelite/submissions|admin/submissions/upload|admin/branding/(hardcore/)?logo)$ {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Direct /admin and /xp navigation needs the React entry document.
    location / { try_files $uri $uri/ /index.html; }
}
