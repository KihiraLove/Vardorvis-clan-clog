# One origin for the SPA and API; TLS terminates outside this container.
log_format safe_request '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout safe_request;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Nginx liveness is distinct from the API image's database readiness probe.
    location = /healthz { access_log off; return 200 'ok'; }
    location = /readyz { access_log off; proxy_pass http://127.0.0.1:3000; }
    # Upstream error messages can include the full callback URL; API logs are sanitized.
    location = /api/v1/auth/discord/callback {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # One 2 MiB image plus bounded multipart overhead.
    client_max_body_size 3m;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Direct /admin and /xp navigation needs the React entry document.
    location / { try_files $uri $uri/ /index.html; }
}
