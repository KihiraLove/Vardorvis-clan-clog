# Explicit opt-in passwordless admin test; never deploy this override publicly.
name: vardorvis-clog-local-admin
services:
  app:
    environment:
      NODE_ENV: development
      DEV_ADMIN_MODE: 'true'
      AUTH_ENABLED: 'false'
      PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT:-8088}
      TRUSTED_PROXY_CIDRS: ''
# compose.yaml already binds the web and database ports to 127.0.0.1.
