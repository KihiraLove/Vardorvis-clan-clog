name: Clean up development images
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without changing packages
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-images.yml
      - scripts/cleanup-images.mjs
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: container-package-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - run: node --test scripts/cleanup-images.test.mjs
      - name: Remove expired development images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node scripts/cleanup-images.mjs
          else
            node scripts/cleanup-images.mjs --apply
          fi
