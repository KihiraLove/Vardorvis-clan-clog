name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clog
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clog -d clog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://clog:ci-only-password@127.0.0.1:5432/clog_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run validate

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Validate Compose
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Build all service images
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile bot build
      - name: Start and smoke test
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml --profile bot up -d --wait --wait-timeout 120
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8088/healthz
          curl --fail http://127.0.0.1:8088/api/v1/status
          docker compose exec -T bot node -e "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile bot logs --no-color --tail 100
      - name: Clean up
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile bot down --volumes

  frontend-browser:
    name: frontend-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @clog/domain
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @clog/web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: frontend-browser-review
          path: apps/web/test-results/
          retention-days: 7

  publish:
    name: publish
    needs: [validate, docker-smoke, frontend-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      commit: ${{ github.sha }}
