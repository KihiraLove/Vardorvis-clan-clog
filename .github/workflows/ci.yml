# Hosted-runner gates; only a successful main push may publish release images.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    # Supplying TEST_DATABASE_URL makes the optional local integration test run in CI.
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clog
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clog -d clog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://clog:ci-only-password@127.0.0.1:5432/clog_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Export formatted integration sources
        run: |
          npx prettier --write apps/api/src/review-*.ts apps/api/src/review.integration.test.ts apps/api/src/app.ts apps/api/src/auth.ts apps/api/src/server.ts docs/integration-01-review.md
          for file in apps/api/src/review-*.ts apps/api/src/review.integration.test.ts apps/api/src/app.ts apps/api/src/auth.ts apps/api/src/server.ts docs/integration-01-review.md; do
            echo "INTEGRATION_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "INTEGRATION_FORMAT_END:$file"
          done
      - run: npm run validate

  docker-smoke:
    # Exercise image startup, one-shot migrations, proxy routing and scaffold health.
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      IMAGE_TAG: ci
      AUTH_ENABLED: 'true'
      PUBLIC_ORIGIN: https://clog.example.com
      DISCORD_CLIENT_ID: '123456789012345678'
      DISCORD_CLIENT_SECRET: ci-placeholder-not-a-real-secret
      DISCORD_OAUTH_REDIRECT_URI: https://clog.example.com/api/v1/auth/discord/callback
      ADMIN_DISCORD_USER_IDS: '123456789012345678'
      SESSION_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Validate Compose
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Build all service images
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile bot build
      - name: Start and smoke test
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml --profile bot up -d --wait --wait-timeout 120
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8088/healthz
          curl --fail http://127.0.0.1:8088/api/v1/status
          curl --fail --output /tmp/catalog.json http://127.0.0.1:8088/api/v1/catalog
          jq -e '(.items | length) == 1717 and (.pages | length) == 124' /tmp/catalog.json
          curl --fail --output /dev/null http://127.0.0.1:8088/catalog/items/1249.png
          curl --fail --output /tmp/collections.json http://127.0.0.1:8088/api/v1/collections
          jq -e '.credits == []' /tmp/collections.json
          curl --fail http://127.0.0.1:8088/api/v1/settings
          curl --fail --output /tmp/xp.json http://127.0.0.1:8088/api/v1/xp/tracker
          jq -e '(.revision == "xp-1") and (.events == []) and (.totals | .mining == "0")' /tmp/xp.json
          curl --fail http://127.0.0.1:8088/api/v1/auth/session
          docker compose exec -T bot node -e "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile bot logs --no-color --tail 100
      - name: Clean up
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile bot down --volumes

  frontend-browser:
    # Preview/mocked browser flows form a separate gate from Node unit tests.
    name: frontend-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @clog/domain
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @clog/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-browser-review
          path: apps/web/test-results/
          retention-days: 7

  publish:
    # PRs and manual validation never enter this package-publishing path.
    name: publish
    needs: [validate, docker-smoke, frontend-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      commit: ${{ github.sha }}
