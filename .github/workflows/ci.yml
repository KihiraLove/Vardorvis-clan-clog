# Hosted-runner gates; only a successful main push may publish release images.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    # Supplying TEST_DATABASE_URL makes the optional local integration test run in CI.
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clog
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clog -d clog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://clog:ci-only-password@127.0.0.1:5432/clog_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run validate

  docker-smoke:
    # Exercise image startup, one-shot migrations, proxy routing and scaffold health.
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      APP_DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      IMAGE_TAG: ci
      AUTH_ENABLED: 'true'
      PUBLIC_ORIGIN: https://clog.example.com
      SESSION_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Validate Compose
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Validate opt-in Traefik labels and private network topology
        env:
          CLOG_HOST: clog.example.com
        run: |
          docker compose -f compose.yaml -f compose.traefik.yaml config --quiet
          docker compose -f compose.yaml -f compose.traefik.yaml config --format json > /tmp/clog-traefik.json
          jq -e '
            (.services.app.networks | keys | sort) == ["default", "web"] and
            .services.app.environment.PUBLIC_ORIGIN == "https://clog.example.com" and
            .services.app.environment.AUTH_ENABLED == "true" and
            .networks.web.external == true and
            (.services.app.labels."traefik.docker.network" == "web") and
            (.services.app.labels."traefik.http.services.clog.loadbalancer.server.port" == "8080") and
            (.services.app.labels."traefik.http.routers.clog.tls.certresolver" == "letsencrypt") and
            (.services.app.labels."traefik.http.routers.clog.entrypoints" == "websecure") and
            ([.services | to_entries[] | select(.key != "app") | (.value.networks // {} | keys[])] | index("web") == null)
          ' /tmp/clog-traefik.json
      - name: Build the unified application image
        run: docker compose -f compose.yaml -f compose.dev.yaml build
      - name: Start and smoke test
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up -d --wait --wait-timeout 120
          # Fresh install applies the immutable baseline and forward-only upgrades.
          test "$(docker compose exec -T db psql -U clog -d clog -Atc "SELECT string_agg(name, ',' ORDER BY name) FROM schema_migrations")" = "001_baseline.sql,002_manual_submission_requests.sql,003_staff_accounts.sql,004_runelite_submissions.sql,005_clan_api_keys.sql,006_clan_logos.sql,007_site_customization.sql,008_default_clan_name.sql,009_runelite_world_types.sql,010_hardcore_appearance.sql,011_catalog_page_management.sql,012_runelite_auto_review.sql,013_collection_log_schedules.sql"
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8088/healthz
          curl --fail http://127.0.0.1:8088/api/v1/status
          curl --fail --output /tmp/catalog.json http://127.0.0.1:8088/api/v1/catalog
          jq -e '(.items | length) == 1717 and (.pages | length) == 124' /tmp/catalog.json
          jq -e '
            ([.pages[] | select(.id=="hard_treasure_trails_rare") | .itemIds | length] == [24]) and
            ([.pages[] | select(.id=="elite_treasure_trails_rare") | .itemIds | length] == [39]) and
            ([.pages[] | select(.id=="master_treasure_trails_rare") | .itemIds | length] == [45]) and
            ([.pages[] | select(.id=="gilded" or .id=="third_age" or .id=="mimic")] | length == 0) and
            (. as $catalog | ($catalog.items[] | select(.name=="Ring of 3rd Age") | .id) as $ring |
             ([ $catalog.pages[] | select(.id=="elite_treasure_trails" or .id=="master_treasure_trails") |
                select(.itemIds | index($ring)) ] | length) == 2)
          ' /tmp/catalog.json
          curl --fail --output /dev/null http://127.0.0.1:8088/catalog/items/1249.png
          curl --fail --output /tmp/collections.json http://127.0.0.1:8088/api/v1/collections
          jq -e '.credits == []' /tmp/collections.json
          curl --fail http://127.0.0.1:8088/api/v1/settings
          curl --fail --output /tmp/xp.json http://127.0.0.1:8088/api/v1/xp/tracker
          jq -e '(.revision == "xp-1") and (.events == []) and (.totals | .mining == "0")' /tmp/xp.json
          curl --fail -sS http://127.0.0.1:8088/api/v1/auth/session | jq -e '.authenticated == false'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/v1/admin/settings)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://clog.example.com' \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"wrong"}' \
            http://127.0.0.1:8088/api/v1/auth/login)" = "401"
          docker compose exec -T app node -e "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      - name: Verify restricted database runtime and append-only audit privileges
        run: |
          docker compose exec -T app node --input-type=module -e "
            import pg from 'pg';
            const client = new pg.Client({connectionString: process.env.DATABASE_URL});
            await client.connect();
            try {
              const current = (await client.query('SELECT current_user AS user')).rows[0].user;
              if (current !== 'clog_runtime') throw Error('API must not run as migrator');
              const roles = (await client.query(\"SELECT has_table_privilege(current_user,'public.audit_events','INSERT') AS ai, has_table_privilege(current_user,'public.audit_events','UPDATE') AS au, has_table_privilege(current_user,'public.audit_events','DELETE') AS ad, has_table_privilege(current_user,'public.catalog_audit','DELETE') AS cd, has_table_privilege(current_user,'public.xp_import_history','UPDATE') AS xu, has_table_privilege(current_user,'public.schema_migrations','SELECT') AS ms, has_table_privilege(current_user,'public.submissions','UPDATE') AS su\")).rows[0];
              if (JSON.stringify(roles) !== JSON.stringify({ai:true,au:false,ad:false,cd:false,xu:false,ms:false,su:true})) throw Error('Unexpected runtime grants: '+JSON.stringify(roles));
              for (const table of ['runelite_settings_audit', 'collection_schedule_audit']) {
                const audit = (await client.query(\"SELECT has_table_privilege(current_user, 'public.' || \$1, 'SELECT') AS read, has_table_privilege(current_user, 'public.' || \$1, 'INSERT') AS append, has_table_privilege(current_user, 'public.' || \$1, 'UPDATE') AS edit, has_table_privilege(current_user, 'public.' || \$1, 'DELETE') AS remove\", [table])).rows[0];
                if (JSON.stringify(audit) !== JSON.stringify({read:true,append:true,edit:false,remove:false})) throw Error('Unexpected audit grants: '+table);
              }
            } finally { await client.end(); }
          "
      - name: Proxy isolation and durable manual submission retries
        run: docker compose exec -T -e REVIEW_SMOKE_TEST=1 app node --input-type=module < scripts/review-smoke.mjs
      - name: Admin catalog, durable icons and coordinated backup
        env:
          COMPOSE_FILE: compose.yaml:compose.dev.yaml
        run: |
          docker compose exec -T -e CATALOG_SMOKE_TEST=1 app node --input-type=module < scripts/catalog-smoke.mjs > /tmp/catalog-created.json
          icon_path="$(jq -r '.iconPath' /tmp/catalog-created.json)"
          curl --fail "http://127.0.0.1:8088$icon_path" --output /tmp/icon-before.png
          docker compose up -d --no-deps --force-recreate --wait app
          curl --fail --retry 5 --retry-delay 1 --retry-connrefused "http://127.0.0.1:8088$icon_path" --output /tmp/icon-after.png
          cmp /tmp/icon-before.png /tmp/icon-after.png
          curl --fail --output /tmp/catalog-after.json http://127.0.0.1:8088/api/v1/catalog
          jq -e --slurpfile receipt /tmp/catalog-created.json '
            ([.pages[] | select(.category=="bosses")][0].id == $receipt[0].pageId) and
            ([.pages[] | select(.id==$receipt[0].pageId) | .itemIds] == [[$receipt[0].itemId]]) and
            ([.pages[] | select(.id==$receipt[0].deletedPageId)] | length == 0)
          ' /tmp/catalog-after.json
          bash infra/backup.sh /tmp/catalog-backup
          test -f /tmp/catalog-backup/COMPLETE
          (cd /tmp/catalog-backup && sha256sum --check SHA256SUMS)
          tar -tzf /tmp/catalog-backup/icons.tar.gz | grep "$(basename "$icon_path")"
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --tail 100 || true
      - name: Clean up
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down --volumes

  frontend-browser:
    # Preview/mocked browser flows form a separate gate from Node unit tests.
    name: frontend-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @clog/domain
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @clog/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-browser-review
          path: apps/web/test-results/
          retention-days: 7

  publish:
    # PRs and manual validation never enter this package-publishing path.
    name: publish
    needs: [validate, docker-smoke, frontend-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      commit: ${{ github.sha }}
