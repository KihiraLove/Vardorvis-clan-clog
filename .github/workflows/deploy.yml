# Manual promotion: verify release provenance on GitHub before using the home runner.
name: Deploy
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full 40-character SHA from a successful published-release CI run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    concurrency:
      group: container-package-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify successful published-release CI
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Expected a full commit SHA"; exit 1; }
          gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=release&head_sha=$RELEASE_SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          jq -e --arg sha "$RELEASE_SHA" '.workflow_runs | any(.event == "release" and .head_sha == $sha and .conclusion == "success")' "$RUNNER_TEMP/runs.json" >/dev/null
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
  deploy:
    # Verify the installed launcher; it extracts versioned infrastructure from the approved image.
    needs: verify
    environment: production
    runs-on: [self-hosted, Linux, clan-clog-production]
    timeout-minutes: 15
    steps:
      - name: Deploy installed release
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
          LAUNCHER_SHA256: ${{ vars.CLOG_DEPLOY_LAUNCHER_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$LAUNCHER_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'Configure the reviewed launcher checksum'; exit 1; }
          test "$(sha256sum /srv/clan-collection-log/deploy.sh | cut -d' ' -f1)" = "$LAUNCHER_SHA256"
          /srv/clan-collection-log/deploy.sh "$RELEASE_SHA"
